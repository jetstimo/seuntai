<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Seuntai logo | (c) 2026 Joseph Edward Timothy Siahaan dan Sidah Fahira. Seuntai(TM).
       Konsep: tiga garis paralel (multilines) masuk ke satu cincin pengikat lalu keluar sebagai seuntai garis utuh. -->
  <defs>
    <radialGradient id="bg" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#3A1F6E"/>
      <stop offset="0.55" stop-color="#22114A"/>
      <stop offset="1" stop-color="#140A2C"/>
    </radialGradient>
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FFB703"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="123" fill="none" stroke="#A898FF" stroke-opacity="0.25" stroke-width="2"/>
  <!-- banyak garis -->
  <g fill="none" stroke="#A898FF" stroke-linecap="round" stroke-width="10">
    <path d="M26 100 C 60 96, 84 116, 108 124" stroke-opacity="0.95"/>
    <path d="M20 131 C 56 131, 84 130, 108 130" stroke-opacity="0.78"/>
    <path d="M28 162 C 60 164, 84 146, 108 136" stroke-opacity="0.6"/>
  </g>
  <!-- seuntai -->
  <path d="M120 130 C 160 130, 176 96, 214 92" fill="none" stroke="#FF4D6D" stroke-width="26" stroke-linecap="round" opacity="0.45" filter="url(#glow)"/>
  <path d="M120 130 C 160 130, 176 96, 214 92" fill="none" stroke="url(#strand)" stroke-width="24" stroke-linecap="round"/>
  <path d="M126 127 C 160 126, 176 96, 208 92" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- cincin pengikat -->
  <circle cx="118" cy="130" r="20" fill="#140A2C" stroke="url(#ring)" stroke-width="9"/>
  <circle cx="214" cy="92" r="11" fill="#FFFFFF"/>
</svg>
